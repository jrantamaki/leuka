<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekkiroikunta</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --text: #f2f5f9;
    --muted: #8b97a8;
    --accent: #38bdf8;
    --prep: #f59e0b;
    --done: #22c55e;
    --ring: #2a3340;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    gap: 16px;
    -webkit-user-select: none;
    user-select: none;
    transition: background-color .25s ease;
  }
  body.flash-mile { background: #14342a; }
  body.flash-final { background: #1d3a1d; }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    text-align: center;
  }

  .goal-picker {
    width: min(560px, 100%);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--ring);
    border-radius: 18px;
    padding: 12px;
  }
  .goal-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  .goals {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 380px) {
    .goals { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 620px) {
    .goals { grid-template-columns: repeat(6, 1fr); }
  }
  /* Kohotettu "painike"-ulkoasu, jotta valinta erottuu klikattavaksi */
  .goal {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 4px;
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    border-radius: 14px;
    border: 2px solid #3d4a5d;
    background: linear-gradient(180deg, #273140, #1c242f);
    color: #dbe3ee;
    box-shadow: 0 3px 0 #0a0d12;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease,
                border-color .15s ease, color .15s ease;
  }
  .goal::before {
    content: "";
    width: 13px;
    height: 13px;
    flex: none;
    border-radius: 50%;
    border: 2px solid #6b7a8f;
    background: transparent;
  }
  .goal.active {
    background: linear-gradient(180deg, #4cc8fb, #23a9e4);
    border-color: #7fdcff;
    color: #06121b;
    box-shadow: 0 3px 0 #0a4f6d;
  }
  .goal.active::before {
    border-color: #06121b;
    background: #06121b;
    box-shadow: inset 0 0 0 2px #7fdcff;
  }
  .goal:active { transform: translateY(3px); box-shadow: none; }
  .goal:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .goal:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; transform: none; }
  @media (hover: hover) {
    .goal:not(.active):not(:disabled):hover {
      border-color: var(--accent);
      color: #fff;
      background: linear-gradient(180deg, #2f3c4e, #222c39);
    }
  }

  .timer {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: clamp(60px, 24vw, 160px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0;
    transition: color .2s ease, transform .15s ease;
  }
  .timer.prep { color: var(--prep); }
  .timer.run { color: var(--text); }
  .timer.done { color: var(--done); }
  .timer.pulse { transform: scale(1.06); }

  .status {
    font-size: 18px;
    font-weight: 600;
    min-height: 26px;
    color: var(--accent);
    text-align: center;
  }

  .bar-wrap { width: min(560px, 100%); padding-bottom: 24px; }
  .bar {
    height: 26px;
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 13px;
    position: relative;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: linear-gradient(90deg, #0ea5e9, #22c55e);
  }
  .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255,255,255,.25);
  }
  .tick.half { width: 3px; background: rgba(255,255,255,.6); }
  .tick span {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .splits {
    width: min(560px, 100%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .split {
    flex: 0 0 calc(25% - 6px);
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 12px;
    padding: 9px 2px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: all .2s ease;
  }
  .split.goal-chip { border-color: var(--accent); color: var(--accent); }
  @media (min-width: 480px) {
    .split { flex: 0 0 calc(16.666% - 7px); }
  }
  .split.hit {
    background: #14532d;
    border-color: var(--done);
    color: #dcfce7;
  }

  .buttons {
    display: flex;
    gap: 12px;
    width: min(560px, 100%);
  }
  .buttons button {
    flex: 1;
    padding: 22px 12px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 16px;
    border: 1px solid var(--ring);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 3px 0 #0a0d12;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .buttons button:active { transform: translateY(3px); box-shadow: none; }
  #startBtn { background: var(--accent); border-color: var(--accent); color: #06121b; flex: 2; box-shadow: 0 3px 0 #0a4f6d; }
  #startBtn.running { background: #ef4444; border-color: #ef4444; color: #fff; box-shadow: 0 3px 0 #7f1d1d; }

  .hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 560px; margin: 0; }
</style>
</head>
<body>

<h1 id="heading">Rekkiroikunta – tavoite 2:00</h1>

<div class="goal-picker">
  <div class="goal-label" id="goalLabel">Valitse tavoiteaika</div>
  <div class="goals" id="goals"></div>
</div>

<p class="timer prep" id="display">-0:15</p>
<div class="status" id="status">Paina KÄYNNISTÄ</div>

<div class="bar-wrap">
  <div class="bar">
    <div class="fill" id="fill"></div>
    <div id="ticks"></div>
  </div>
</div>

<div class="splits" id="splits"></div>

<div class="buttons">
  <button id="startBtn">KÄYNNISTÄ</button>
  <button id="resetBtn">NOLLAA</button>
</div>

<p class="hint">Ajastin alkaa -15 sekunnista, jotta ehdit ottaa tangosta kiinni. Huomioääni 15 sekunnin välein, puheviesti puolivälissä ja viimeiset 5 sekuntia lasketaan alas.</p>

<script>
(function () {
  "use strict";

  var PREP = 15;                       // sekuntia valmistautumiseen
  var GOALS = [30, 60, 90, 120, 150, 180];  // valittavat tavoiteajat
  var COUNTDOWN = 5;                   // loppulaskennan pituus sekunteina
  var goal = 120;

  var heading = document.getElementById("heading");
  var goalsEl = document.getElementById("goals");
  var goalLabel = document.getElementById("goalLabel");
  var display = document.getElementById("display");
  var statusEl = document.getElementById("status");
  var fill = document.getElementById("fill");
  var ticksEl = document.getElementById("ticks");
  var splitsEl = document.getElementById("splits");
  var startBtn = document.getElementById("startBtn");
  var resetBtn = document.getElementById("resetBtn");

  var goalBtns = {};
  var splitEls = {};

  var running = false;
  var startStamp = 0;     // performance.now() kun viimeksi käynnistettiin
  var accumulated = 0;    // ms kertynyttä aikaa ennen nykyistä jaksoa
  var rafId = null;
  var lastWholeSecond = null;
  var wakeLock = null;

  // Puoliväli-puheviesti vain 1:00, 1:30 ja 2:00 tavoitteille
  function halfwayPoint() { return goal >= 60 ? goal / 2 : null; }

  // ---------- Ääni (Web Audio, ei ulkoisia tiedostoja) ----------
  var ctx = null;
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function beep(freq, duration, when, volume, type) {
    var ac = audio();
    if (!ac) return;
    var t0 = ac.currentTime + (when || 0);
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume || 0.3, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  function chord(freqs, duration, volume) {
    freqs.forEach(function (f, i) { beep(f, duration, i * 0.12, volume || 0.25, "triangle"); });
  }

  // Sama huomioääni kuin lähdössä
  function markSound() {
    beep(880, 0.35, 0, 0.35, "square");
    buzz([60, 40, 120]);
  }

  function applause(seconds) {
    var ac = audio();
    if (!ac) return;
    var len = Math.floor(ac.sampleRate * seconds);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var data = buf.getChannelData(0);
    // Taustakohina + yksittäiset "läpsäykset"
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * 0.12;
    var claps = Math.floor(seconds * 55);
    for (var c = 0; c < claps; c++) {
      var pos = Math.floor(Math.random() * (len - 1200));
      var amp = 0.35 + Math.random() * 0.5;
      for (var j = 0; j < 1200; j++) {
        var env = Math.exp(-j / 160);
        data[pos + j] += (Math.random() * 2 - 1) * amp * env;
      }
    }
    // Hiipuva loppu
    var fadeStart = Math.floor(len * 0.65);
    for (var k = fadeStart; k < len; k++) data[k] *= 1 - (k - fadeStart) / (len - fadeStart);

    var src = ac.createBufferSource();
    src.buffer = buf;
    var bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1800;
    bp.Q.value = 0.7;
    var gain = ac.createGain();
    gain.gain.value = 0.5;
    src.connect(bp).connect(gain).connect(ac.destination);
    src.start();

    // Päälle pieni fanfaari
    chord([523.25, 659.25, 783.99, 1046.5], 0.9, 0.22);
  }

  // iOS vaatii, että puhe käynnistetään ensimmäisen kerran käyttäjän eleestä.
  // Siksi "herätetään" syntetisaattori äänettömällä lausumalla start-napissa.
  var speechPrimed = false;
  var fiVoice = null;

  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    var voices = window.speechSynthesis.getVoices() || [];
    fiVoice = voices.filter(function (v) { return /^fi/i.test(v.lang); })[0] || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
  }

  function primeSpeech() {
    if (speechPrimed || !("speechSynthesis" in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.lang = "fi-FI";
      window.speechSynthesis.speak(u);
      speechPrimed = true;
      pickVoice();
    } catch (e) { /* ei väliä */ }
  }

  function say(text) {
    if (!("speechSynthesis" in window)) return;
    try {
      var synth = window.speechSynthesis;
      if (synth.paused) synth.resume();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "fi-FI";
      if (fiVoice) u.voice = fiVoice;
      u.rate = 1.05;
      u.volume = 1;
      synth.speak(u);
    } catch (e) { /* ei väliä */ }
  }

  function buzz(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  // ---------- Näyttö ----------
  function fmt(sec) {
    var neg = sec < 0;
    var s = Math.abs(sec);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (neg ? "-" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  function spoken(sec) {
    var words = {
      30: "kolmekymmentä sekuntia",
      45: "neljäkymmentäviisi sekuntia",
      60: "yksi minuutti",
      75: "minuutti ja viisitoista sekuntia",
      90: "puolitoista minuuttia",
      120: "kaksi minuuttia",
      150: "kaksi ja puoli minuuttia",
      180: "kolme minuuttia"
    };
    return words[sec] || (sec + " sekuntia");
  }

  function pulse() {
    display.classList.add("pulse");
    setTimeout(function () { display.classList.remove("pulse"); }, 400);
  }

  function flash(cls, ms) {
    document.body.classList.add(cls);
    display.classList.add("pulse");
    setTimeout(function () {
      document.body.classList.remove(cls);
      display.classList.remove("pulse");
    }, ms);
  }

  function setStatus(text, color) {
    statusEl.textContent = text;
    statusEl.style.color = color || "var(--accent)";
  }

  // ---------- Tavoitteen mukaan rakennettavat osat ----------
  function marks() {
    var out = [];
    for (var s = 15; s < goal; s += 15) out.push(s);
    out.push(goal);
    return out;
  }

  function buildGoalButtons() {
    goalsEl.innerHTML = "";
    goalBtns = {};
    GOALS.forEach(function (g) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "goal" + (g === goal ? " active" : "");
      b.setAttribute("aria-pressed", g === goal ? "true" : "false");
      b.appendChild(document.createTextNode(fmt(g)));
      b.addEventListener("click", function () { selectGoal(g); });
      goalsEl.appendChild(b);
      goalBtns[g] = b;
    });
  }

  function buildTicksAndSplits() {
    var half = halfwayPoint();

    ticksEl.innerHTML = "";
    marks().forEach(function (m) {
      if (m >= goal) return;
      var t = document.createElement("div");
      t.className = "tick" + (m === half ? " half" : "");
      t.style.left = (m / goal * 100) + "%";
      if (m === half) {
        var lbl = document.createElement("span");
        lbl.textContent = fmt(m) + " · puoliväli";
        t.appendChild(lbl);
      }
      ticksEl.appendChild(t);
    });

    splitsEl.innerHTML = "";
    splitEls = {};
    marks().forEach(function (m) {
      var d = document.createElement("div");
      d.className = "split" + (m === goal ? " goal-chip" : "");
      d.textContent = fmt(m);
      splitsEl.appendChild(d);
      splitEls[m] = d;
    });
  }

  function selectGoal(g) {
    if (g === goal) { reset(); return; }
    goal = g;
    try { localStorage.setItem("rekki-goal", String(g)); } catch (e) {}
    Object.keys(goalBtns).forEach(function (k) {
      var on = Number(k) === goal;
      goalBtns[k].classList.toggle("active", on);
      goalBtns[k].setAttribute("aria-pressed", on ? "true" : "false");
    });
    heading.textContent = "Rekkiroikunta – tavoite " + fmt(goal);
    buildTicksAndSplits();
    reset();
  }

  function lockGoals(locked) {
    GOALS.forEach(function (g) { goalBtns[g].disabled = locked; });
    goalLabel.textContent = locked ? "Tavoiteaika lukittu ajon ajaksi"
                                   : "Valitse tavoiteaika";
  }

  // ---------- Virstanpylväät ----------
  function onSecond(sec) {
    var half = halfwayPoint();

    if (sec < 0) {
      if (sec >= -3) { beep(660, 0.12, 0, 0.3); buzz(40); }
      setStatus("Valmistaudu – ota kiinni tangosta!", "var(--prep)");
      return;
    }
    if (sec === 0) {
      markSound();
      setStatus("Roiku! Aika juoksee.", "var(--accent)");
      return;
    }
    if (sec === goal) {
      if (splitEls[goal]) splitEls[goal].classList.add("hit");
      flash("flash-final", 3000);
      applause(5);
      buzz([200, 80, 200, 80, 400]);
      setStatus(fmt(goal) + " – TAVOITE SAAVUTETTU! 👏", "var(--done)");
      say("Tavoite saavutettu! " + spoken(goal));
      return;
    }
    if (sec > goal) {
      setStatus("Bonusaikaa: +" + (sec - goal) + " s 💪", "var(--done)");
      return;
    }
    if (sec >= goal - COUNTDOWN) {
      // Viimeiset 5 sekuntia: piippaava countdown
      beep(1046.5, 0.12, 0, 0.32, "square");
      buzz(50);
      setStatus("Loppukiri – " + (goal - sec) + " s jäljellä!", "var(--prep)");
      return;
    }
    if (sec === half) {
      if (splitEls[sec]) splitEls[sec].classList.add("hit");
      flash("flash-mile", 1200);
      markSound();
      chord([523.25, 659.25, 783.99], 0.6, 0.28);
      setStatus("PUOLIVÄLI – " + fmt(sec) + " kulunut!", "var(--done)");
      say("Puoliväli. " + spoken(sec) + " kulunut.");
      return;
    }
    if (sec % 15 === 0) {
      if (splitEls[sec]) splitEls[sec].classList.add("hit");
      markSound();
      pulse();
      setStatus(fmt(sec) + " – jatka! " + (goal - sec) + " s jäljellä.", "var(--accent)");
      return;
    }
    setStatus("Roiku! " + (goal - sec) + " s jäljellä.", "var(--accent)");
  }

  function elapsedMs() {
    return accumulated + (running ? performance.now() - startStamp : 0);
  }

  function render() {
    var ms = elapsedMs();
    var shown = Math.floor(ms / 1000) - PREP;       // näytettävä aika sekunteina
    var whole = Math.floor(ms / 1000);

    display.textContent = fmt(shown);
    display.className = "timer " + (shown < 0 ? "prep" : (shown >= goal ? "done" : "run"));

    var pct = Math.max(0, Math.min(1, (ms / 1000 - PREP) / goal));
    fill.style.width = (pct * 100) + "%";

    if (lastWholeSecond === null || whole !== lastWholeSecond) {
      // Käy läpi kaikki ohitetut sekunnit, jotta yksikään merkki ei jää väliin
      var from = lastWholeSecond === null ? whole : lastWholeSecond + 1;
      for (var s = from; s <= whole; s++) onSecond(s - PREP);
      lastWholeSecond = whole;
    }

    if (running) rafId = requestAnimationFrame(render);
  }

  // ---------- Näytön hereillä pito ----------
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) { /* ei tuettu */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && running) requestWakeLock();
  });

  // ---------- Ohjaus ----------
  function start() {
    audio();        // avaa äänen käyttäjän eleellä
    primeSpeech();  // avaa puhesynteesin (pakollinen iOS:ssä)
    running = true;
    startStamp = performance.now();
    startBtn.textContent = "PYSÄYTÄ";
    startBtn.classList.add("running");
    lockGoals(true);
    requestWakeLock();
    rafId = requestAnimationFrame(render);
  }

  function stop() {
    if (!running) return;
    accumulated += performance.now() - startStamp;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    startBtn.textContent = "JATKA";
    startBtn.classList.remove("running");
    lockGoals(false);
    releaseWakeLock();
    var shown = Math.floor(accumulated / 1000) - PREP;
    setStatus(shown >= 0 ? "Pysäytetty – tulos " + fmt(shown) : "Pysäytetty", "var(--muted)");
    render();
  }

  function reset() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    accumulated = 0;
    lastWholeSecond = null;
    lockGoals(false);
    releaseWakeLock();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    startBtn.textContent = "KÄYNNISTÄ";
    startBtn.classList.remove("running");
    display.textContent = fmt(-PREP);
    display.className = "timer prep";
    fill.style.width = "0%";
    setStatus("Paina KÄYNNISTÄ");
    Object.keys(splitEls).forEach(function (k) { splitEls[k].classList.remove("hit"); });
  }

  startBtn.addEventListener("click", function () { running ? stop() : start(); });
  resetBtn.addEventListener("click", reset);

  // Välilyönti = käynnistä/pysäytä, R = nollaa, 1–4 = tavoiteaika
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); running ? stop() : start(); }
    if (e.key === "r" || e.key === "R") reset();
    var n = Number(e.key);
    if (n >= 1 && n <= GOALS.length && !running) selectGoal(GOALS[n - 1]);
  });

  // ---------- Käynnistys ----------
  try {
    var saved = Number(localStorage.getItem("rekki-goal"));
    if (GOALS.indexOf(saved) !== -1) goal = saved;
  } catch (e) {}
  heading.textContent = "Rekkiroikunta – tavoite " + fmt(goal);
  buildGoalButtons();
  buildTicksAndSplits();
  reset();
})();
</script>
</body>
</html>
